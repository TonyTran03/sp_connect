<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Better Jam</title><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="What do you want to play?">
        <span id="spinner" class="spinner" hidden></span>
      </div>
      <div id="searchDrop" class="search-drop" hidden><p id="status">Search Spotify</p><div id="results"></div></div>
    </header>

    <div class="columns">
      <section class="playlist-panel">
        <div class="playlist-hero">
          <label class="cover-picker"><img id="eventCover" alt="Event artwork"><span>Choose photo</span><input id="coverInput" type="file" accept="image/*" hidden></label>
          <div class="event-copy"><p>PLAYLIST</p><h1 id="eventTitle" contenteditable="true">Tonight's Jam</h1><div id="eventDescription" contenteditable="true">Pick a song and add it to tonight’s playlist.</div></div>
        </div>
        <div class="list-heading"><span>#</span><span>Title</span><span>Played</span></div>
        <div id="playlist" class="track-list"></div>
      </section>

      <aside class="now-panel">
        <p class="overline">NOW PLAYING</p><div id="nowPlaying" class="now-playing"></div>
        <div class="next-head"><h2>Up next</h2><span id="queueCount"></span></div>
        <div id="nextUp" class="track-list compact"></div>
      </aside>
    </div>
  </main>
  <div id="toast" class="toast"></div>
</body>
</html>
