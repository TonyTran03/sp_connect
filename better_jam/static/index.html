<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Better Jam</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./scroll.css"><link rel="stylesheet" href="./mobile.css"><script src="./site-settings.js?v=1" defer></script><script src="./app.js?v=12" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="playlistToggle" class="playlist-toggle" type="button" aria-controls="playlistPanel" aria-expanded="false">View playlist</button>
      <div class="identity-wrap">
        <label for="displayName">Queued as</label>
        <input id="displayName" maxlength="24" autocomplete="nickname" placeholder="Guest name">
        <button id="saveName" type="button">Save</button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="What do you want to play?">
        <span id="spinner" class="spinner" hidden></span>
      </div>
      <div id="searchDrop" class="search-drop" hidden><p id="status">Search Spotify</p><div id="results"></div></div>
    </header>

    <div class="columns">
      <section id="playlistPanel" class="playlist-panel">
        <div class="playlist-hero">
          <div class="cover-picker"><img id="eventCover" alt="Event artwork"></div>
          <div class="event-copy"><p>PLAYLIST</p><h1 id="eventTitle"></h1><div id="eventDescription"></div></div>
        </div>
        <div class="list-heading"><span>#</span><span>Title</span><span>Played</span></div>
        <div id="playlist" class="track-list"></div>
      </section>

      <aside class="now-panel">
        <p class="overline">NOW PLAYING</p><div id="nowPlaying" class="now-playing"></div>
        <div class="next-head"><h2>Next up <span id="queueCount"></span></h2></div>
        <div id="nextUp" class="track-list compact"></div>
      </aside>
    </div>
  </main>
  <div id="banBanner" class="ban-banner" role="status" aria-live="polite"></div>
  <div id="toast" class="toast"></div>
</body>
</html>
